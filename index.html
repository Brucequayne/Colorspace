/* Layout: eine ruhige App-Übersicht. Kopfzeile mit Marke und Sprache, darunter eine knappe Einleitung und große Kacheln mit Vorschaubild. */
:root{
  --bg:#ECEDE9;
  --card:#F7F7F4;
  --ink:#151715;
  --soft:#565C56;
  --line:#CDD1CA;
  --accent:#9A540A;
  --f-display:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111311;--card:#1A1D1A;--ink:#ECEEE8;--soft:#A3AAA2;--line:#2C302C;--accent:#E8A04A;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111311;--card:#1A1D1A;--ink:#ECEEE8;--soft:#A3AAA2;--line:#2C302C;--accent:#E8A04A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);font-style:normal;text-wrap:balance;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#app,#app *{font-style:normal}

.page{max-width:1200px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:600 1.15rem/1 var(--f-display);letter-spacing:-.01em;text-decoration:none}
.brand i{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:22px;height:22px}
.brand i b{border-radius:3px;background:var(--ink)}.brand i b:nth-child(2){background:var(--accent)}
.navr{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}
.navbtn{font:600 .88rem var(--f-body);padding:7px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);white-space:nowrap}
.navbtn:hover{border-color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.navbtn{background:transparent;cursor:pointer;border-color:var(--ink)}
@media (max-width:640px){.navr .navbtn{display:none}}
@media (max-width:520px){.navbtn{padding:6px 10px;font-size:.8rem}.navr{gap:5px}.seg button{padding:6px 8px;min-width:30px;font-size:.78rem}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:600 .88rem var(--f-body);padding:7px 13px;min-width:42px;border:0;background:transparent;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline-offset:-3px}

/* Startseite */
.hero{padding:56px 0 8px;max-width:760px}
.hero h1{font:600 clamp(2.6rem,7vw,4.6rem)/1 var(--f-display);letter-spacing:-.035em}
.hero p{color:var(--soft);font-size:1.12rem;margin:18px 0 0;max-width:52ch}
.label{display:block;margin:52px 0 16px;font:600 .78rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px}
@media (min-width:1100px){.apps{grid-template-columns:repeat(4,1fr)}}
.app{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:var(--ink);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.app:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 14px 34px rgba(0,0,0,.10)}
.app:focus-visible{outline-offset:4px}
.app .pv{aspect-ratio:16/10;max-width:100%;overflow:hidden;border-bottom:1px solid var(--line)}
.app .pv svg{display:block;width:100%;height:100%}
.app .bd{display:flex;flex-direction:column;gap:8px;padding:18px 20px 20px;flex:1}
.app h2{font:600 1.4rem/1.15 var(--f-display);letter-spacing:-.015em}
.app p{margin:0;color:var(--soft);font-size:.98rem;line-height:1.5}
.app .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.app .ver{font:600 .75rem var(--f-body);color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.app .go{font-weight:600;font-size:.92rem}
.app:hover .go{color:var(--accent)}
.pw{fill:#F7F4EE;stroke:#1E1C1A;stroke-width:3.5;stroke-linejoin:round}.pw .d{fill:#1E1C1A}.pw .e{fill:#F7F4EE;stroke:none}.pw .dl{fill:none}
.pb{fill:#2B2725;stroke:#0E0D0C;stroke-width:3.5;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.app{transition:none}.app:hover{transform:none}}

/* Unterseiten */
.back{display:inline-block;margin:22px 0 0;color:var(--soft);text-decoration:none;font-weight:600}
.back:hover{color:var(--ink)}
.ptitle{font:600 clamp(2.2rem,6vw,3.6rem)/1.05 var(--f-display);letter-spacing:-.03em;margin:24px 0 18px}
.pintro{color:var(--soft);max-width:60ch;margin:0}
.phow{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);max-width:64ch}
.phow h2{font:600 1.4rem/1.2 var(--f-display);margin:0 0 10px}
.phow p{color:var(--soft);margin:0 0 12px}
.lbl{color:var(--soft);font-size:.92rem}
.pitem{max-width:62ch;padding:16px 0;border-bottom:1px solid var(--line)}
.pitem h2{font:600 1.15rem/1.3 var(--f-display);margin-bottom:4px}
.pitem p{margin:0;color:var(--soft)}
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:.92rem;color:var(--soft)}
.foot a{color:inherit}

/* Fotoprojekt */
.rgbstage{position:relative;height:clamp(520px,86vh,960px);background:#000;overflow:hidden;isolation:isolate;border-radius:6px;margin-top:26px;user-select:none;-webkit-user-select:none}
.rgbstage:focus-visible{outline-offset:4px}
.lyr{position:absolute;display:block;max-width:none;mix-blend-mode:screen;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.lyr.grab{cursor:grabbing}
.lyr.off{display:none}
.rgbstage.anim .lyr{transition:left .4s ease,top .4s ease}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.chip button{font:inherit;color:var(--ink);background:transparent;border:0;cursor:pointer}
.chip .sel{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;padding:8px 14px 8px 12px}
.chip .sel i{width:14px;height:14px;border-radius:50%;grid-row:1/3}
.chip .sel b{font-weight:600;line-height:1.2}
.chip .sel .off{font:500 .78rem/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--soft);white-space:pre}
.chip .sel[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .sel[aria-pressed="true"] .off{color:inherit;opacity:.8}
.chip .eye{padding:0 14px;border-left:1px solid var(--line);font-weight:600;font-size:.85rem;min-width:56px;color:var(--soft)}
.chip .eye[aria-pressed="true"]{color:var(--ink)}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:14px}
.snap{display:inline-flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.snap input{width:18px;height:18px;accent-color:var(--accent)}
.pstat{margin:16px 0 0;color:var(--soft);min-height:1.6em}
.pstat.ok{color:var(--accent);font-weight:600}
</style>

  function privacyHTML() {
    return '<a class="back" href="#">' + U("back") + '</a><h1 class="ptitle">' + PRIV.title[S.lang] + "</h1>" +
      PRIV.items.map(function (it) { return '<div class="pitem"><h2>' + it.h[S.lang] + "</h2><p>" + it.p[S.lang] + "</p></div>"; }).join("");
  }

  var CH = [
    { k: "r", img: "rgb-rot.png", c: "#E5484D" },
    { k: "g", img: "rgb-gruen.png", c: "#30A46C" },
    { k: "b", img: "rgb-blau.png", c: "#3E63DD" }
  ];
  var PW = 1000, PH = 1500, pjScale = 1, pjOrigin = { ox: 0, oy: 0 }, drag = null, animT = 0;

  function projectHTML() {
    var P = S.pj, L = S.lang;
    var lay = P.z.map(function (k, i) {
      var c = CH.filter(function (x) { return x.k === k; })[0];
      return '<img class="lyr' + (P.on[k] ? "" : " off") + '" data-ch="' + k + '" src="' + c.img + '" alt="' + PJ.alt[k][L] + '" draggable="false" style="z-index:' + (i + 1) + '">';
    }).join("");
    var chips = CH.map(function (c) {
      return '<div class="chip"><button type="button" class="sel" data-sel="' + c.k + '" aria-pressed="' + (P.active === c.k) + '"><i style="background:' + c.c + '"></i><b>' + PJ.name[c.k][L] + '</b><span class="off" id="o-' + c.k + '"></span></button>' +
        '<button type="button" class="eye" data-vis="' + c.k + '" aria-pressed="' + P.on[c.k] + '">' + (P.on[c.k] ? PJ.on[L] : PJ.off[L]) + "</button></div>";
    }).join("");
    return '<a class="back" href="#">' + U("back") + '</a><h1 class="ptitle">' + PJ.title[L] + '</h1><p class="pintro">' + PJ.intro[L] + "</p>" +
      '<div class="rgbstage" id="rgbstage" tabindex="0">' + lay + "</div>" +
      '<div class="chips">' + chips + "</div>" +
      '<div class="pbar"><button type="button" class="navbtn" data-pjreset>' + PJ.reset[L] + '</button><button type="button" class="navbtn" data-pjspread>' + PJ.spread[L] + "</button>" +
      '<label class="snap"><input type="checkbox" data-snap' + (P.snap ? " checked" : "") + "> " + PJ.snap[L] + "</label></div>" +
      '<p class="pstat" id="pjstat" aria-live="polite"></p>' +
      '<section class="phow"><h2>' + PJ.howH[L] + "</h2><p>" + PJ.how1[L] + "</p><p>" + PJ.how2[L] + "</p></section>";
  }

  function sg(n) { return (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n); }

  function updateUI() {
    var P = S.pj, al = true;
    CH.forEach(function (c) {
      var x = P.x[c.k], y = P.y[c.k];
      var el = document.getElementById("o-" + c.k);
      if (el) el.textContent = "x " + sg(Math.round(x)) + "  y " + sg(Math.round(y));
      if (!P.on[c.k] || Math.abs(x) >= 0.5 || Math.abs(y) >= 0.5) al = false;
    });
    var s = document.getElementById("pjstat");
    if (s) {
      s.textContent = al ? (P.touched ? PJ.ok[S.lang] : PJ.start[S.lang]) : PJ.hint[S.lang];
      s.classList.toggle("ok", al && P.touched);
    }
  }

  function layout() {
    var st = document.getElementById("rgbstage");
    if (!st) return;
    var sw = st.clientWidth, sh = st.clientHeight, m = 12;
    pjScale = Math.min((sw - 2 * m) / PW, (sh - 2 * m) / PH, 1);
    var dw = PW * pjScale, dh = PH * pjScale;
    pjOrigin = { ox: (sw - dw) / 2, oy: (sh - dh) / 2 };
    Array.prototype.forEach.call(st.querySelectorAll(".lyr"), function (im) {
      var k = im.getAttribute("data-ch");
      im.style.width = dw + "px";
      im.style.height = dh + "px";
      im.style.left = (pjOrigin.ox + S.pj.x[k] * pjScale) + "px";
      im.style.top = (pjOrigin.oy + S.pj.y[k] * pjScale) + "px";
    });
    updateUI();
  }

  function animate() {
    var st = document.getElementById("rgbstage");
    if (!st) return;
    st.classList.add("anim");
    clearTimeout(animT);
    animT = setTimeout(function () { st.classList.remove("anim"); }, 450);
  }

  function selectLayer(k) {
    var P = S.pj;
    P.active = k;
    P.z = P.z.filter(function (x) { return x !== k; }).concat(k);
    P.z.forEach(function (key, i) {
      var im = document.querySelector('.lyr[data-ch="' + key + '"]');
      if (im) im.style.zIndex = i + 1;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".sel"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-sel") === k));
    });
  }

  function clampPos(k, nx, ny) {
    var st = document.getElementById("rgbstage");
    var sw = st.clientWidth, sh = st.clientHeight, dw = PW * pjScale, dh = PH * pjScale;
    var l = Math.min(Math.max(pjOrigin.ox + nx * pjScale, -dw * 0.8), sw - dw * 0.2);
    var tp = Math.min(Math.max(pjOrigin.oy + ny * pjScale, -dh * 0.8), sh - dh * 0.2);
    return { x: (l - pjOrigin.ox) / pjScale, y: (tp - pjOrigin.oy) / pjScale };
  }

  function setPos(k, nx, ny) {
    var p = clampPos(k, nx, ny);
    if (S.pj.snap && Math.sqrt(p.x * p.x + p.y * p.y) * pjScale < 7) { p.x = 0; p.y = 0; }
    S.pj.x[k] = p.x;
    S.pj.y[k] = p.y;
  }

  function pjReset() {
    var P = S.pj;
    animate();
    CH.forEach(function (c) { P.x[c.k] = 0; P.y[c.k] = 0; P.on[c.k] = true; });
    refreshEyes();
    layout();
  }
  function pjSpread() {
    var P = S.pj;
    P.touched = true;
    animate();
    var d = { r: [-170, -90], g: [150, -50], b: [10, 130] };
    CH.forEach(function (c) { var p = clampPos(c.k, d[c.k][0], d[c.k][1]); P.x[c.k] = p.x; P.y[c.k] = p.y; });
    layout();
  }
  function refreshEyes() {
    CH.forEach(function (c) {
      var b = document.querySelector('[data-vis="' + c.k + '"]');
      var im = document.querySelector('.lyr[data-ch="' + c.k + '"]');
      if (b) { b.setAttribute("aria-pressed", String(S.pj.on[c.k])); b.textContent = S.pj.on[c.k] ? PJ.on[S.lang] : PJ.off[S.lang]; }
      if (im) im.classList.toggle("off", !S.pj.on[c.k]);
    });
  }

  function render() {
    if (window.Flughafen) window.Flughafen.unmount();
    if (window.Gigachess) window.Gigachess.unmount();
    if (window.Colorspin) window.Colorspin.unmount();
    var v = S.view;
    if (v === "flughafen" || v === "gigachess" || v === "colorspin") {
      app.innerHTML = '<a class="back" href="#">' + U("back") + '</a><div id="approot"></div>';
      var mod = { flughafen: window.Flughafen, gigachess: window.Gigachess, colorspin: window.Colorspin }[v];
      if (mod) mod.mount(document.getElementById("approot"), S.lang);
    } else if (v === "fotoprojekt") { app.innerHTML = projectHTML(); layout(); }
    else if (v === "privacy") app.innerHTML = privacyHTML();
    else app.innerHTML = homeHTML();
    ["flughafen", "gigachess", "colorspin", "fotoprojekt"].forEach(function (k) {
      var el = document.getElementById("nav-" + k);
      if (v === k) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
    });
  }

  function applyLang(l) {
    S.lang = l;
    document.documentElement.lang = l;
    document.getElementById("l-de").setAttribute("aria-pressed", String(l === "de"));
    document.getElementById("l-en").setAttribute("aria-pressed", String(l === "en"));
    document.getElementById("plink").textContent = U("privacy");
    ["flughafen", "gigachess", "colorspin", "fotoprojekt"].forEach(function (k) { document.getElementById("nav-" + k).textContent = U(k); });
    try { localStorage.setItem("lang", l); } catch (e) {}
    render();
  }

  function setView() {
    var id = location.hash.replace("#", "");
    S.view = id === "datenschutz" ? "privacy" : ["flughafen", "gigachess", "colorspin", "fotoprojekt"].indexOf(id) >= 0 ? id : "home";
  }
  function route() { setView(); render(); window.scrollTo(0, 0); }

  document.querySelector(".top").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (b) applyLang(b.getAttribute("data-lang"));
  });
  window.addEventListener("resize", function () { if (S.view === "fotoprojekt") layout(); });

  app.addEventListener("pointerdown", function (e) {
    var im = e.target.closest && e.target.closest(".lyr");
    if (!im || (e.button && e.button > 0)) return;
    e.preventDefault();
    var k = im.getAttribute("data-ch");
    selectLayer(k);
    S.pj.touched = true;
    var st = document.getElementById("rgbstage");
    st.classList.remove("anim");
    drag = { k: k, id: e.pointerId, sx: e.clientX, sy: e.clientY, x0: S.pj.x[k], y0: S.pj.y[k], el: im };
    try { im.setPointerCapture(e.pointerId); } catch (err) {}
    im.classList.add("grab");
  });
  window.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    setPos(drag.k, drag.x0 + (e.clientX - drag.sx) / pjScale, drag.y0 + (e.clientY - drag.sy) / pjScale);
    layout();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.el.classList.remove("grab");
    drag = null;
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  app.addEventListener("keydown", function (e) {
    if (!e.target.closest || !e.target.closest("#rgbstage")) return;
    var P = S.pj, step = e.shiftKey ? 10 : 1, dx = 0, dy = 0;
    if (e.key === "1") { selectLayer("r"); return; }
    if (e.key === "2") { selectLayer("g"); return; }
    if (e.key === "3") { selectLayer("b"); return; }
    if (e.key === "ArrowLeft") dx = -step; else if (e.key === "ArrowRight") dx = step;
    else if (e.key === "ArrowUp") dy = -step; else if (e.key === "ArrowDown") dy = step;
    else return;
    e.preventDefault();
    P.touched = true;
    var k = P.active, p = clampPos(k, Math.round(P.x[k]) + dx, Math.round(P.y[k]) + dy);
    P.x[k] = Math.round(p.x); P.y[k] = Math.round(p.y);
    layout();
  });

  app.addEventListener("click", function (e) {
    var sel = e.target.closest("[data-sel]");
    if (sel) { selectLayer(sel.getAttribute("data-sel")); return; }
    var vis = e.target.closest("[data-vis]");
    if (vis) { var vk = vis.getAttribute("data-vis"); S.pj.on[vk] = !S.pj.on[vk]; S.pj.touched = true; refreshEyes(); updateUI(); return; }
    if (e.target.closest("[data-pjreset]")) { pjReset(); return; }
    if (e.target.closest("[data-pjspread]")) { pjSpread(); return; }
  });
  app.addEventListener("change", function (e) {
    if (e.target.closest("[data-snap]")) S.pj.snap = e.target.checked;
  });

  window.addEventListener("hashchange", route);
  var saved = "";
  try { saved = localStorage.getItem("lang") || ""; } catch (e) {}
  var start = (saved === "de" || saved === "en") ? saved : ((navigator.language || "de").slice(0, 2) === "de" ? "de" : "en");
  setView();
  applyLang(start);
})();
